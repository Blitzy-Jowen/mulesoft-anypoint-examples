# upload-to-ftp-after-converting-json-to-xml-java runtime configuration
# Replaces upload-to-ftp-after-converting-json-to-xml/src/main/app/mule-app.properties (empty) and the
# http:listener-config and ftp:outbound-endpoint of upload-to-ftp.xml. The ftp.* keys are the names the
# original test read from mule.test.properties; the original flow hard-coded the FTP host and credentials.
http:
  port: 8081                       # original placeholder name ${http.port}; listener port (upload-to-ftp.xml:4)
server:
  port: ${http.port:8081}
  address: 0.0.0.0                 # original listener host (upload-to-ftp.xml:4)
spring:
  application:
    name: upload-to-ftp-after-converting-json-to-xml-java
  web:
    resources:
      add-mappings: false          # SC-1: unknown paths must raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # the / listener has no allowedMethods: TRACE reaches EmployeeUploadController like every other method instead of the servlet's message/http echo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path
ftp:
  host: ${FTP_HOST:}               # TODO: supply the FTP server host (original hard-coded ftp-server.demo.solarwinds.com)
  port: 21                         # original fixed port (non-secret default)
  path: /Upload/                   # original fixed remote directory (non-secret default)
  user: ${FTP_USER:}               # TODO: supply the FTP user (original hard-coded the login in the flow)
  password: ${FTP_PASSWORD:}       # TODO: supply the FTP password (original hard-coded the password in the flow)
# upload-to-ftp.xml has no logger, so neither the posted employees JSON nor the XML uploaded from it is logged at any
# level: a root DEBUG/TRACE override, or --debug/--trace, must not reach these categories, which below INFO write the
# employees' names and addresses. A logger's own level outranks logging.level.root and the --debug/--trace groups.
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO   # DEBUG/TRACE write the posted employees JSON, as the decimal values of its bytes
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO          # DEBUG/TRACE write the response body: the employees XML bytes, and the 500 body carrying a parser message that quotes the payload
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO   # DEBUG writes the handled exception's message, which quotes the rejected payload
    org.springframework.web.method.HandlerMethod: INFO   # TRACE writes handler arguments, the handled exception and its message included
    org.springframework.web.HttpLogging: INFO            # the HTTP message converters write through this category wherever their own is held at INFO

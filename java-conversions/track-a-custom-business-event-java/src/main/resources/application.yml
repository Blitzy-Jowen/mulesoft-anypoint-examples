# track-a-custom-business-event-java runtime configuration
# Replaces track-a-custom-business-event/src/main/app/mule-app.properties (empty) and the
# http:listener-config of custom-business-events.xml
http:
  port: 8081            # original placeholder name ${http.port} (AAP 0.4.6); default port of the original README
server:
  port: ${http.port:8081}
  address: 0.0.0.0      # http:listener-config host (custom-business-events.xml:3)
spring:
  application:
    name: track-a-custom-business-event-java
  web:
    resources:
      add-mappings: false   # SC-1: unknown paths must raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # the /customBusinessEvents listener has no allowedMethods: TRACE reaches BusinessEventController like every other method instead of the servlet's message/http echo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path

# Test-only values for Spring profile "test" (surefire sets spring.profiles.active=test; tests may also
# use @ActiveProfiles("test")). They are the public demo values of the original test
# importing-a-CSV-file-into-Mongo-DB/src/test/java/org/mule/examples/ImportCSVfileIntoMongoDBIT.java
# (DB_NAME, MONGO_USER, MONGO_PASSWORD), set there as the same system properties.
# Never used in production, where database.* come from the TODO placeholders of application.yml.
# The values must be non-empty: an empty password cannot bind to spring.data.mongodb.password, and an
# empty user makes the connection string Boot builds from host, port and credentials unparseable.
# database.name also selects the database when a test supplies its own connection string, so documents
# land in collection "customers" of database "customers", where the original test counted them.
database:
  name: customers
  user: test_user
  password: test_password

# web-service-consumer-java runtime configuration
# Replaces web-service-consumer/src/main/app/mule-app.properties (empty) and the listener and
# web service consumer settings of tshirt-service-consumer.xml.
http:
  port: 8081
server:
  port: ${http.port:8081}
  address: 0.0.0.0
spring:
  application:
    name: web-service-consumer-java
  web:
    resources:
      add-mappings: false   # unknown paths must reach GlobalExceptionHandler as 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # /orders and /inventory listeners have no allowedMethods: TRACE reaches TshirtController
    formcontent:
      filter:
        enabled: false   # TshirtController reads the raw body: a form body on PUT/PATCH/DELETE reaches it as it does on POST instead of being parsed by Boot's filter before dispatch
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404
tshirt:
  service-address: http://tshirt-service.cloudhub.io
  # TODO: supply the T-shirt service API key (replaces the literal hard-coded at tshirt-service-consumer.xml:22)
  api-key: ${TSHIRT_API_KEY:}
  # Mule's default response timeout; upstream timeouts are never retried
  connect-timeout: 10s
  read-timeout: 10s
logging:
  level:
    # tshirt-service-consumer.xml has no logger, so neither the API key nor the customer's order is logged at any level: a root DEBUG/TRACE override, or --debug/--trace, must not reach these
    org.springframework.ws.client.MessageTracing: INFO   # .sent/.received TRACE write every SOAP envelope: the AuthenticationHeader apiKey and the order's name, e-mail and address
    org.springframework.web.method.HandlerMethod: INFO   # TRACE writes handler arguments, the handled exception and its message included
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO   # DEBUG writes the handled exception's message, which can repeat the posted order or the service's fault text
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO          # DEBUG/TRACE write the response body, the 500 body carrying that message included

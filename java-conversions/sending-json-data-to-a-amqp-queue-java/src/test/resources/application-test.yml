# Spring profile "test", activated with @ActiveProfiles("test") by the surefire tests only; overlays
# src/main/resources/application.yml. Points the AMQP client at the embedded Qpid Broker-J the tests start.
# The broker's port is free-chosen at start-up and registered with @DynamicPropertySource, so none is set here.
# guest/guest is the embedded broker's demo user declared in src/test/resources/config.json (the original
# test broker's work/etc/passwd held the same guest:guest entry); it is not a real credential.
amqp:
  host: 127.0.0.1   # original test property amqp.host (SendingJsonDataToAmqpQueueIT.java:131)
spring:
  rabbitmq:
    host: 127.0.0.1   # the embedded broker binds 127.0.0.1 only (config.json); localhost may resolve to ::1
    username: guest
    password: guest

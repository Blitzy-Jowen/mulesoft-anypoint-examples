<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${providerName}">SampleAPI</title>
  </head>
  <body>
    <!--/* Login page of /authorize, standing in for the one the Mule OAuth2 provider module generated.
           The ids and names below are a contract: AuthorizationController reads username, password and
           the five hidden fields; the browser tests locate username, password and submit.
           No skip link: the page has no navigation block to bypass, only this one form. */-->
    <main>
      <h1 th:text="${providerName}">SampleAPI</h1>
      <p id="client"><span th:text="${clientName}">Client</span> (<span th:text="${clientDescription}">description</span>) is requesting access to your account.</p>
      <p id="scopes">Requested scopes: <span th:text="${scope}">scope</span></p>
      <p id="error" role="alert" th:if="${error}" th:text="${error}"></p>
      <!--/* A literal root-relative action, not th:action: the form must post to /authorize on the provider
             host and port that served the page. */-->
      <form id="login" method="post" action="/authorize">
        <input type="hidden" name="response_type" th:value="${responseType}">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <input type="hidden" name="redirect_uri" th:value="${redirectUri}">
        <input type="hidden" name="scope" th:value="${scope}">
        <input type="hidden" name="state" th:value="${state}">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username">
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <div>
          <input type="submit" id="submit" value="Login and Authorize">
        </div>
      </form>
    </main>
  </body>
</html>

# implementing-a-choice-exception-strategy-java runtime configuration
# Replaces implementing-a-choice-exception-strategy/src/main/app/mule-app.properties (empty)
# and the http:listener-config of choice-error-handling.xml:3 (host 0.0.0.0, port ${http.port}).
http:
  port: 8081            # original placeholder name ${http.port} (AAP 0.4.6); default port of the original README
server:
  port: ${http.port:8081}
  address: 0.0.0.0      # http:listener-config host (choice-error-handling.xml:3)
spring:
  application:
    name: implementing-a-choice-exception-strategy-java
  web:
    resources:
      add-mappings: false   # SC-1: unknown paths must raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    # With TRACE dispatched, FrameworkServlet still writes the servlet's message/http echo into a reply left uncommitted
    # after the handler, so every reply on / must be committed with its Content-Length, the empty 200 filter rejection
    # included; a ResponseEntity built without a body (even with contentLength(0)) is not committed.
    dispatch-trace-request: true   # the / listener has no allowedMethods: TRACE reaches ValidationController like every other method instead of the servlet's message/http echo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path
logging:
  level:
    # choice-error-handling.xml has no logger, so no caller data is logged at any level: a root DEBUG/TRACE override must not reach these
    org.springframework.web.servlet.mvc.method.annotation: INFO   # DEBUG/TRACE write request and response bodies and the handled exception's message
    org.springframework.web.method.HandlerMethod: INFO            # TRACE writes handler arguments, the handled exception and its message included

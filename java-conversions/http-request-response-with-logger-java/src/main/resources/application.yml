# http-request-response-with-logger-java runtime configuration
# Replaces http-request-response-with-logger/src/main/app/mule-app.properties and the http:listener-config of echo.xml
http:
  port: 8081            # original placeholder name ${http.port}; 8084 in the original README is only an example value
server:
  port: ${http.port:8081}
  address: 0.0.0.0      # http:listener-config host (echo.xml:3)
spring:
  application:
    name: http-request-response-with-logger-java
  web:
    resources:
      add-mappings: false   # no static resource handler competes with EchoController's /** echo; SC-1's no-listener 404 relies on it too

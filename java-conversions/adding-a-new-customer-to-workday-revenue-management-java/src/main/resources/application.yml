# Runtime configuration of adding-a-new-customer-to-workday-revenue-management-java.
# Converted from adding-a-new-customer-to-workday-revenue-management/src/main/app/mule-app.properties (empty)
# and the ${...} placeholders of src/main/app/add_a_new_customer.xml (lines 3 and 5); key names keep the original names.
# Never commit credentials here; live-test values go in src/test/resources/application-it.yml (git-ignored).
# Each "TODO: supply" marks a value the operator provides through the named environment variable, not unfinished
# configuration; the empty default lets the application start, and tests run, without it.
spring:
  application:
    name: adding-a-new-customer-to-workday-revenue-management-java
  web:
    resources:
      add-mappings: false        # unknown paths raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # the / listener accepts POST only: TRACE reaches the dispatcher and gets SC-1's 405 instead of the servlet's 200 TRACE echo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path

http:
  port: 8081                     # original ${http.port}; the original README's example used 9090

server:
  port: ${http.port:8081}
  address: 0.0.0.0               # original listener host

wday:
  hostname: ${WDAY_HOSTNAME:}    # TODO: supply the Workday host name, e.g. impl-cc.workday.com
  tenant: ${WDAY_TENANT:}        # TODO: supply the Workday tenant ID (usually ends with _pt1)
  user: ${WDAY_USER:}            # TODO: supply the Workday integration user (sent as user@tenant)
  password: ${WDAY_PASSWORD:}    # TODO: supply the Workday integration user's password
  # Endpoint the Workday connector derived from host and tenant. Kept at v25.0 because Put_Customer is replaced by
  # Submit_Customer from v31.1; the WSDL's own soap:address is relative, so the client always uses this key.
  endpoint: https://${wday.hostname}/ccx/service/${wday.tenant}/Revenue_Management/v25.0
  # Connect and read timeouts: the Mule default response timeout
  connect-timeout: 10s
  read-timeout: 10s

# add_a_new_customer.xml has no logger, so neither the Workday password, the UsernameToken's user@tenant principal nor
# the customer is logged at any level: a root DEBUG/TRACE override, or --debug/--trace, must not reach these
# categories, which below INFO write them. A logger's own level outranks logging.level.root and the --debug/--trace
# groups; the JDK category is a java.util.logging logger, which Spring Boot bridges and holds at the same level.
logging:
  level:
    org.springframework.ws.client.MessageTracing: INFO   # .sent/.received TRACE write the whole secured envelope: wsse:Username user@tenant, the PasswordText password and the customer XML; .received also the customer descriptor and Workday's fault text
    sun.net.www.protocol.http.HttpURLConnection: INFO    # the Workday sender's JDK transport: FINE writes the request line with the tenant path and every request and response header, Set-Cookie included
    org.springframework.web.method.HandlerMethod: INFO   # TRACE writes handler arguments, a handled exception and the Workday fault text it carries included
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO   # DEBUG/TRACE write the posted customer XML bytes
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO          # DEBUG/TRACE write the response body: "Added customer: <descriptor>" and the 500 body with the fault text
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO   # DEBUG writes the handled exception's message, the Workday fault text that can quote the posted customer
    org.springframework.web.HttpLogging: INFO            # the HTTP message converters write through this category wherever their own is held at INFO

# content-based-routing-java runtime configuration
# Replaces content-based-routing/src/main/app/mule-app.properties (empty) and the http:listener-config of content-based-routing.xml
http:
  port: 8081            # original placeholder name ${http.port} (AAP 0.4.6); default port of the original README
server:
  port: ${http.port:8081}
  address: 0.0.0.0      # http:listener-config host (content-based-routing.xml:3)
spring:
  application:
    name: content-based-routing-java
  web:
    resources:
      add-mappings: false   # SC-1: unknown paths must raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # the / listener has no allowedMethods: TRACE reaches GreetingController instead of the servlet's TRACE echo
    formcontent:
      filter:
        enabled: false   # the flow reads the raw body, never form fields: a form body on PUT/PATCH/DELETE reaches GreetingController as it does on POST instead of being parsed by Boot's filter before dispatch
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path

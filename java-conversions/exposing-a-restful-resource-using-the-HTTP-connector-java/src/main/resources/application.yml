# exposing-a-restful-resource-using-the-HTTP-connector-java runtime configuration
# Replaces exposing-a-restful-resource-using-the-HTTP-connector/src/main/app/mule-app.properties (empty) and the
# http:listener-config of http-restful-resource.xml; its unused http:request-config (xml:5) has no key
http:
  port: 8081            # original placeholder name ${http.port} (AAP 0.4.6); default port of the original README
server:
  port: ${http.port:8081}
  address: 0.0.0.0      # http:listener-config host (http-restful-resource.xml:4)
spring:
  application:
    name: exposing-a-restful-resource-using-the-HTTP-connector-java
  web:
    resources:
      add-mappings: false   # SC-1: unknown paths must raise NoHandlerFoundException -> 404 "No listener for endpoint: <path>"
  mvc:
    dispatch-trace-request: true   # /person accepts GET and POST, /person/{personId} GET only: TRACE reaches the dispatcher and gets SC-1's 405 instead of the servlet's 200 TRACE echo
    formcontent:
      filter:
        enabled: false   # PersonController rejects the other methods before reading the body: a form body on PUT/PATCH/DELETE gets SC-1's 405 unread instead of being buffered whole by Boot's filter before dispatch
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path
logging:
  level:
    # http-restful-resource.xml logs only "Person id is <id>" (ERROR, service/PersonService): below INFO these loggers
    # write the persons' names, addresses, zip codes and ages. A logger's own level outranks logging.level.root and the
    # --debug and --trace groups, so none of them reaches these loggers.
    org.springframework.web.method.HandlerMethod: INFO   # TRACE writes handler arguments, the handled exception whose message quotes a rejected person body among them
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO   # DEBUG/TRACE write the Content-Type and the posted person's body bytes read for POST /person
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO   # DEBUG writes the handled exception's message, which quotes a rejected person body
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO   # DEBUG/TRACE write the response body: the person JSON of GET /person and GET /person/{personId}, the 500 body quoting a rejected person

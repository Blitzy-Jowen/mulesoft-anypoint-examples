# xml-only-soap-webservice-java runtime configuration
# Replaces xml-only-soap-webservice/src/main/resources/config.dev.properties, the listener and request
# configs of Hospital_Admissions_SOA.xml:16-17 and src/main/app/mule-app.properties (no keys).
http:
  port: 8081                                   # config.dev.properties:1
  request:                                     # replaces HTTP_Request_Configuration (Hospital_Admissions_SOA.xml:17)
    host: localhost                            # original target host 0.0.0.0; localhost reaches the same local listener on every OS
    port: ${local.server.port:${http.port}}    # read at call time: the bound port once Undertow starts (RANDOM_PORT tests), else http.port
    response-timeout: 10000                    # Mule default response timeout, ms (none declared on the request config)
server:
  port: ${http.port:8081}                      # HTTP_Listener_Configuration (Hospital_Admissions_SOA.xml:16)
  address: 0.0.0.0
spring:
  application:
    name: xml-only-soap-webservice-java
  web:
    resources:
      add-mappings: false                      # no static-resource handler answers any path
  webservices:
    # path stays at Boot's default: WebServicesProperties rejects "/" ("Path must have length greater than 1")
    # and the application would not start. WebServiceConfig narrows messageDispatcherServlet to exactly
    # /AdmissionService, /PatientService and /EHRService, whatever its initial mapping.
    servlet:
      # Servlet init-params, so the values are strings. No original listener declares allowedMethods
      # (Hospital_Admissions_SOA.xml:20, mocks.xml:5,46), so OPTIONS and TRACE must reach SoapListenerBoundaryAdapter.
      init:
        dispatchOptionsRequest: "true"
        dispatchTraceRequest: "true"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # WebServiceConfig.ListenerPathFilter owns the no-listener 404

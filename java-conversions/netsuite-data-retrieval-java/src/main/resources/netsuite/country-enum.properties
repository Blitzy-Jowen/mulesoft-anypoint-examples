# NetSuite REST address country code -> SuiteTalk Country enum constant name.
#
# NetSuite REST returns an address country as its two-letter code, for example
# {"id": "US", "refName": "United States"}. The Mule NetSuite connector returned
# the SuiteTalk Country Java enum constant instead and DataWeave rendered its
# name, so each entry maps the REST code to that name: US -> UNITED_STATES.
#
# Loaded once by
# com.mulesoft.examples.netsuite_data_retrieval.mapper.NetsuiteRecordShapeMapper.
# A code missing from this table fails the request with IllegalStateException
# naming the code; a code is never passed through or written as null.
#
# Constant tokens: SuiteTalk SOAP Schema Browser 2025.2, Country enumeration
#   https://system.netsuite.com/help/helpcenter/en_US/srbrowser/Browser2025_2/schema/enum/country.html
#   XSD https://webservices.netsuite.com/xsd/platform/v2025_2_0/common.xsd
# Country codes: Oracle NetSuite Help, "Country Enumerations"
#   https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_N3785183.html
#
# Each schema token becomes a constant name the way JAXB XJC names enum
# constants:
#   1. strip the leading underscore;
#   2. split camelCase into words, an upper-case run before a capitalised word
#      being its own word;
#   3. upper-case the words and join them with underscores.
#   _unitedStates -> UNITED_STATES, _coteDIvoire -> COTE_D_IVOIRE,
#   _virginIslandsUS -> VIRGIN_ISLANDS_US, _vietNam -> VIET_NAM
#
# Non-ISO NetSuite codes included: IC (Canary Islands), EA (Ceuta and Melilla),
# XK (Kosovo).
#
# Only US=UNITED_STATES is fixed by a committed example
# (netsuite-data-retrieval/src/main/api/opportunities-response.json). Tokens of
# older, connector-era WSDLs may differ, for example TURKEY versus TURKIYE and
# CZECH_REPUBLIC versus CZECHIA; any such difference is a Tier 2A/2B
# verification point.
#
# Format: one CODE=CONSTANT per line, sorted by code.

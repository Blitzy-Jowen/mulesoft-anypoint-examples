# Default strategies of WebServiceConfig.SecurityFirstMessageDispatcher. Spring WS's MessageDispatcher constructor
# loads "<short class name>.properties" beside the runtime class, so every subclass needs this file to be created at
# all. The entries are those of Spring WS's own SoapMessageDispatcher.properties, so the subclass falls back exactly
# as SoapMessageDispatcher does; they are used only for a strategy type of which the context holds no bean.
org.springframework.ws.server.EndpointAdapter=\
org.springframework.ws.server.endpoint.adapter.MessageEndpointAdapter,\
org.springframework.ws.server.endpoint.adapter.PayloadEndpointAdapter,\
org.springframework.ws.server.endpoint.adapter.DefaultMethodEndpointAdapter

org.springframework.ws.server.EndpointExceptionResolver=\
org.springframework.ws.soap.server.endpoint.SimpleSoapExceptionResolver,\
org.springframework.ws.soap.server.endpoint.SoapFaultAnnotationExceptionResolver

org.springframework.ws.server.EndpointMapping=\
org.springframework.ws.server.endpoint.mapping.PayloadRootAnnotationMethodEndpointMapping,\
org.springframework.ws.soap.server.endpoint.mapping.SoapActionAnnotationMethodEndpointMapping

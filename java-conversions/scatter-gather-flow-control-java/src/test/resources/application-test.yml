# Spring profile "test", activated with @ActiveProfiles("test"); tests only.
# Points the original smtp.* and mail.* placeholders of scatter-gather.xml:64 at the in-process GreenMail SMTP
# server the tests start (ServerSetupTest.SMTP, port 3025, user scatter@localhost / secret) instead of Gmail.
# These are GreenMail test values, not credentials. Real values come from the environment variables behind the
# placeholders of src/main/resources/application.yml (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM,
# MAIL_TO). A test that binds GreenMail elsewhere overrides smtp.port with @DynamicPropertySource.
smtp:
  host: localhost
  port: 3025
  user: scatter@localhost
  password: secret
mail:
  from: scatter@localhost
  to: receiver@localhost
spring:
  mail:
    properties:
      # GreenMail's plain SMTP listener offers no STARTTLS; only these entries are replaced, so the inherited
      # authentication flags and 10000 ms timeouts of the main configuration still apply.
      "[mail.smtp.starttls.enable]": false
      "[mail.smtps.starttls.enable]": false

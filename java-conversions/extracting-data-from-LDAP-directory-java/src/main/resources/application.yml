http:
  port: 8081
server:
  port: ${http.port:8081}
  address: 0.0.0.0
spring:
  application:
    name: extracting-data-from-LDAP-directory-java
  web:
    resources:
      add-mappings: false   # SC-1: unknown paths reach GlobalExceptionHandler's 404 text
  mvc:
    dispatch-trace-request: true   # the / listener has no allowedMethods: TRACE reaches LdapController like every other method instead of the servlet's message/http echo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration   # no Boot /error endpoint; /error gets the no-listener 404 like any unserved path
ldap:
  port: 389
  url: ldap://localhost:${ldap.port}/dc=my-domain,dc=com
  # TODO: supply the bind DN (original README: cn=Manager,dc=my-domain,dc=com)
  dn: ${LDAP_DN:}
  # TODO: supply the bind password
  password: ${LDAP_PASSWORD:}
